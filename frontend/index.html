<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EternityX Interview Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2714%27 font-size=%2714%27%3E%F0%9F%8E%A4%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --ink: #1a1a18; --muted: #6b6b66;
    --line: #e3e3de; --accent: #2f5d50; --accent-ink: #fff;
    --them: #eef1f0; --me: #2f5d50; --warn: #8a2f2f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --panel: #1e1e23; --ink: #ececea; --muted: #9a9a95;
      --line: #32323a; --accent: #6fae9b; --accent-ink: #14201c;
      --them: #26262d; --me: #2f5d50; --warn: #e0888a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: .75rem 1rem; border-bottom: 1px solid var(--line);
    display: flex; gap: .75rem; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 650; }
  @media (max-width: 30rem) {
    header { padding: .6rem .75rem; gap: .5rem; flex-wrap: nowrap; }
    header h1 { font-size: .9rem; }
    header .sid { display: none; }
    main { padding: .75rem; }
    .msg { max-width: 92%; }
  }
  header .sid { color: var(--muted); font: 12px ui-monospace, monospace; }
  .explain-toggle { display: flex; align-items: center; gap: .35rem; color: var(--muted); font-size: .82rem; cursor: pointer; user-select: none; }
  header .spacer { flex: 1; }
  button {
    font: inherit; padding: .45rem .9rem; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  main { flex: 1; overflow-y: auto; padding: 1rem; }
  /* #log holds the bubbles; align-self only works if it is a flex column. */
  #log { display: flex; flex-direction: column; gap: .75rem; }
  .wrap { max-width: 46rem; margin: 0 auto; display: flex; flex-direction: column; gap: .75rem; }
  .msg { padding: .65rem .9rem; border-radius: 10px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.them { background: var(--them); align-self: flex-start; }
  .msg.me { background: var(--me); color: #fff; align-self: flex-end; }
  .msg.sys { background: transparent; color: var(--muted); align-self: center; font-size: .85rem; text-align: center; max-width: 100%; }
  .msg.pending { animation: pulse 1.7s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .5 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .msg.pending { animation: none } }
  .msg.err {
    align-self: center; max-width: 100%; font-size: .9rem; color: var(--warn);
    background: color-mix(in srgb, var(--warn) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
  }
  .who { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: .2rem; }
  /* Why the engine chose this day. Sits under the question it explains, dimmed
     so it reads as an annotation rather than as something the interviewer said. */
  .why { align-self: flex-start; max-width: 85%; margin-top: -.4rem; font-size: .78rem; color: var(--muted); }
  .why summary { font-size: .78rem; }
  .why dl { margin: .4rem 0 0; display: grid; grid-template-columns: auto 1fr; gap: .15rem .6rem; }
  .why dt { text-transform: uppercase; letter-spacing: .05em; font-size: .66rem; padding-top: .1rem; }
  .why dd { margin: 0; color: var(--ink); }
  .why .tag { font: 11px ui-monospace, monospace; background: var(--them); border: 1px solid var(--line); border-radius: 4px; padding: .05rem .3rem; }
  .msg.me .who { color: #cfe0da; }
  footer { border-top: 1px solid var(--line); padding: .75rem 1rem; background: var(--panel); }
  .finished-bar { display: none; max-width: 46rem; margin: 0 auto; align-items: center;
              justify-content: space-between; gap: .75rem; color: var(--muted); font-size: .9rem; }
  body.is-done .composer { display: none; }
  body.is-done .finished-bar { display: flex; }
  .composer { max-width: 46rem; margin: 0 auto; display: flex; gap: .5rem; }
  textarea {
    flex: 1; resize: none; font: inherit; padding: .55rem .7rem; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-height: 2.6rem; max-height: 9rem;
  }
  details { width: 100%; margin: 0 0 1rem; }
  summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
  details textarea { width: 100%; min-height: 11rem; font: 12px ui-monospace, monospace; margin-top: .5rem; }
  .report { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; align-self: stretch; max-width: 100%; }
  .report h2 { margin: 0 0 .5rem; font-size: .95rem; }
  .report h3 { margin: 1rem 0 .3rem; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .report ul { margin: 0; padding-left: 1.2rem; }
  .report li { margin-bottom: .3rem; }
</style>
</head>
<body>
<header>
  <h1>EternityX Interview Agent</h1>
  <span class="sid" id="sid"></span>
  <span class="spacer"></span>
  <label class="explain-toggle"><input type="checkbox" id="explain" checked> Show reasoning</label>
  <button id="restart">New interview</button>
</header>

<main>
  <div class="wrap">
    <details id="setup" open>
      <summary>Candidate payload (edit before starting)</summary>
      <textarea id="candidate" spellcheck="false"></textarea>
      <p><button class="primary" id="start">Start interview</button></p>
    </details>
    <div id="log"></div>
  </div>
</main>

<footer>
  <form class="composer" id="composer">
    <textarea id="input" placeholder="Answer the interviewer…" disabled></textarea>
    <button class="primary" id="send" disabled>Send</button>
  </form>
  <div class="finished-bar">
    <span>Interview complete, feedback is above.</span>
    <button class="primary" id="again">Start another</button>
  </div>
</footer>

<script>
const API = "/api/interview";

const SAMPLE = {
  member: { id: "CAND-001", name: "Priya", jobRole: "AI Engineer", yearsExperience: 2 },
  missions: [
    { day: 7,  title: "Embeddings Explained", passed: true,  attempts: 2 },
    { day: 9,  title: "Building & Populating the Vector Database", passed: true, attempts: 1 },
    { day: 13, title: "Advanced Prompting: Function Calling & Structured Outputs", passed: true, attempts: 5 },
    { day: 15, title: "Fine-Tuning: Hands-On with LoRA & QLoRA", skipped: true },
    { day: 23, title: "Model Context Protocol (MCP)", passed: true, attempts: 1 },
    { day: 26, title: "Performance Optimization & Cost Management", passed: false, attempts: 4 },
    { day: 27, title: "Security, Privacy & Guardrails", skipped: true }
  ],
  signals: { commitDays: 26, missionsCompleted: 24, missionsFirstTry: 11 }
};

const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send");
let sessionId = null, busy = false, done = false, answered = 0;

$("candidate").value = JSON.stringify(SAMPLE, null, 2);

function newSessionId() {
  sessionId = (crypto.randomUUID?.() ?? String(Date.now())).slice(0, 18);
  $("sid").textContent = sessionId;
}
newSessionId();

function bubble(cls, who, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  if (who) {
    const w = document.createElement("div");
    w.className = "who"; w.textContent = who;
    el.appendChild(w);
  }
  el.appendChild(document.createTextNode(text));
  log.appendChild(el);
  el.scrollIntoView({ block: "end" });
  return el;
}

// The engine picks the day deterministically from the candidate's cohort record
// before the model writes a word. Showing that is the difference between an
// interview that is adaptive and one that merely looks it.
function renderWhy(trace) {
  const box = document.createElement("details");
  box.className = "why";

  const summary = document.createElement("summary");
  summary.textContent = trace.is_follow_up
    ? `Why this follow-up (day ${trace.day})`
    : `Why day ${trace.day}${trace.day_title ? ": " + trace.day_title : ""}`;
  box.appendChild(summary);

  const rows = [
    ["Reason", trace.reason],
    ["Signal", `${trace.tier} / ${trace.pattern}`, true],
    ["Tactic", trace.move, true],
    ["Progress", `question ${trace.questions_asked}, days covered ${trace.days_covered.join(", ")}`],
  ];

  const dl = document.createElement("dl");
  for (const [label, value, mono] of rows) {
    if (!value) continue;
    const dt = document.createElement("dt");
    dt.textContent = label;
    const dd = document.createElement("dd");
    if (mono) {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = value;
      dd.appendChild(tag);
    } else {
      dd.textContent = value;
    }
    dl.append(dt, dd);
  }
  box.appendChild(dl);
  log.appendChild(box);
  return box;
}

function renderFeedback(fb) {
  const box = document.createElement("div");
  box.className = "report";
  const h = document.createElement("h2");
  h.textContent = "Interview feedback";
  box.appendChild(h);

  const p = document.createElement("p");
  p.textContent = fb.summary ?? "";
  box.appendChild(p);

  for (const [key, label] of [["strengths", "Strengths"], ["gaps", "Gaps"], ["next", "Next steps"]]) {
    if (!Array.isArray(fb[key]) || !fb[key].length) continue;
    const h3 = document.createElement("h3");
    h3.textContent = label;
    box.appendChild(h3);
    const ul = document.createElement("ul");
    for (const item of fb[key]) {
      const li = document.createElement("li");
      li.textContent = item;
      ul.appendChild(li);
    }
    box.appendChild(ul);
  }
  log.appendChild(box);
  // "start", not "end": the report is usually taller than the viewport, so
  // scrolling to its bottom lands the reader in the middle of a bullet list
  // with the heading and summary already off-screen.
  box.scrollIntoView({ block: "start" });
}

function setBusy(state) {
  busy = state;
  const locked = state || done || !sessionStarted();
  input.disabled = locked;
  send.disabled = locked;
  if (!locked) input.focus();
}
function sessionStarted() { return $("setup").dataset.started === "1"; }

async function post(body) {
  let res;
  // Opt in per request, so the response stays exactly what the spec defines
  // whenever the reasoning panel is switched off.
  const url = $("explain").checked ? `${API}?explain=1` : API;
  try {
    res = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ sessionId, ...body })
    });
  } catch {
    // Raw fetch rejections read as "Failed to fetch", which tells the user nothing.
    throw new Error("Could not reach the server, check that it is still running.");
  }
  let data = null;
  try { data = await res.json(); } catch { /* non-JSON error body */ }
  if (!res.ok) {
    const detail = data?.detail;
    throw new Error(typeof detail === "string" ? detail : `${res.status} ${res.statusText}`);
  }
  return data;
}

async function exchange(body, thinkingNote) {
  setBusy(true);
  const pending = bubble("sys pending", "", thinkingNote);
  try {
    const data = await post(body);
    pending.remove();
    if (data.done) {
      done = true;
      // On the final turn `reply` is a placeholder ("Interview completed.").
      // The feedback card is the payoff; only fall back to the text if the
      // server sent no feedback.
      if (data.feedback) renderFeedback(data.feedback);
      else if (data.reply) bubble("them", "Interviewer", data.reply);
      document.body.classList.add("is-done");
    } else if (data.reply) {
      bubble("them", "Interviewer", data.reply);
      if (data.trace) renderWhy(data.trace);
    }
    return true;
  } catch (err) {
    pending.remove();
    bubble("err", "", err.message);
    return false;
  } finally {
    setBusy(false);
  }
}

$("start").addEventListener("click", async () => {
  let candidate;
  try {
    candidate = JSON.parse($("candidate").value);
  } catch (err) {
    bubble("err", "", "Candidate JSON is not valid: " + err.message);
    return;
  }
  $("setup").dataset.started = "1";
  $("setup").open = false;
  $("start").disabled = true;
  const started = await exchange({ candidate }, "Reading the candidate's cohort record…");
  if (!started) {
    // The server discards a session whose opening question failed, so there is
    // nothing to send answers to. Without this rollback the composer unlocks
    // anyway and every message 404s, with Start greyed out and the payload
    // panel collapsed -- a dead end whose only exit is "New interview".
    delete $("setup").dataset.started;
    $("setup").open = true;
    $("start").disabled = false;
    setBusy(false);
    bubble("sys", "", "Nothing was started. Fix the problem above, then press Start interview again.");
  }
});

$("composer").addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = input.value.trim();
  if (!message || busy || done) return;
  const mine = bubble("me", "You", message);
  input.value = "";
  // The final turn writes the whole assessment, so it takes noticeably longer
  // than a question. Say so rather than let the wait read as a hang.
  const note = answered >= 7
    ? "Reviewing the full interview and writing your feedback. This takes a few seconds…"
    : "Thinking…";
  answered += 1;
  const sent = await exchange({ message }, note);
  if (!sent) {
    // A failed turn is retryable -- the server works on a copy and only commits
    // on success -- so hand the answer back instead of making them retype it,
    // and drop the bubble for a turn that never actually happened.
    mine.remove();
    input.value = message;
    answered -= 1;
  }
});

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("composer").requestSubmit();
  }
});

function restart() {
  log.replaceChildren();
  done = false;
  answered = 0;
  document.body.classList.remove("is-done");
  newSessionId();
  delete $("setup").dataset.started;
  $("setup").open = true;
  $("start").disabled = false;
  setBusy(false);
}

$("restart").addEventListener("click", restart);
$("again").addEventListener("click", restart);

setBusy(false);
</script>
</body>
</html>
